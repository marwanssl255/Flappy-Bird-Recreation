name: CI Build & Test
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Cache Optimization
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          REST_CHANCE=$(( RANDOM % 100 ))
          if [ $REST_CHANCE -lt 20 ]; then exit 0; fi
          NUM_COMMITS=$(( ( RANDOM % 4 ) + 1 ))
          for i in $(seq 1 $NUM_COMMITS); do
            echo "Build telemetry sync $i at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .build_telemetry.log
            git add .build_telemetry.log
            git commit -m "chore(telemetry): sync build state [skip ci]"
            sleep 2
          done
          git push
